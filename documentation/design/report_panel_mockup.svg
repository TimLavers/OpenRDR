<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760"
     font-family="Segoe UI, Roboto, Arial, sans-serif">
    <defs>
        <style>
            .title { fill:#1f2937; font-size:18px; font-weight:600; }
            .colhdr { fill:#6b7280; font-size:11px; font-weight:600; letter-spacing:.5px; }
            .attr { fill:#1f2937; font-size:13px; }
            .muted { fill:#6b7280; font-size:12px; }
            .val { fill:#1f2937; font-size:13px; text-anchor:end; }
            .high { fill:#c62828; font-size:13px; font-weight:600; text-anchor:end; }
            .sect { fill:#9aa0a6; font-size:10px; font-weight:700; letter-spacing:1px; }
            .body { fill:#263238; font-size:13px; }
            .rpth { fill:#1f2937; font-size:13px; font-weight:700; }
            .note { fill:#8a8f98; font-size:11px; }
            .tag { fill:#5f6368; font-size:10px; font-weight:600; }
        </style>
    </defs>

    <!-- backdrop -->
    <rect x="0" y="0" width="720" height="760" fill="#ECEFF1"/>

    <!-- case inspection panel -->
    <rect x="20" y="20" width="680" height="720" rx="10" fill="#FFFFFF" stroke="#DADCE0"/>

    <!-- ===== header ===== -->
    <text x="44" y="60" class="title">Einstein</text>
    <text x="628" y="52" class="colhdr" text-anchor="end">12 Jun 2026</text>
    <line x1="44" y1="76" x2="676" y2="76" stroke="#ECEFF1"/>

    <!-- ===== attribute table ===== -->
    <text x="44" y="98" class="colhdr">ATTRIBUTE</text>
    <text x="300" y="98" class="colhdr">REFERENCE</text>
    <text x="430" y="98" class="colhdr">UNITS</text>
    <text x="628" y="98" class="colhdr" text-anchor="end">VALUE</text>

    <g>
        <text x="44" y="122" class="attr">Haemoglobin</text>
        <text x="300" y="122" class="muted">135 - 180</text>
        <text x="430" y="122" class="muted">g/L</text>
        <text x="628" y="122" class="high">194</text>
    </g>
    <g>
        <text x="44" y="148" class="attr">MCV</text>
        <text x="300" y="148" class="muted">80 - 98</text>
        <text x="430" y="148" class="muted">fL</text>
        <text x="628" y="148" class="high">100.2</text>
    </g>
    <g>
        <text x="44" y="174" class="attr">eGFR</text>
        <text x="300" y="174" class="muted">&gt; 59</text>
        <text x="430" y="174" class="muted">mL/min</text>
        <text x="628" y="174" class="val">74</text>
    </g>
    <g>
        <text x="44" y="200" class="attr">TSH</text>
        <text x="300" y="200" class="muted">0.5 - 4.0</text>
        <text x="430" y="200" class="muted">mIU/L</text>
        <text x="628" y="200" class="val">2.1</text>
    </g>
    <g>
        <text x="44" y="226" class="attr">Sex</text>
        <text x="628" y="226" class="val">M</text>
    </g>

    <!-- body scrollbar hint -->
    <rect x="666" y="108" width="4" height="70" rx="2" fill="#CFD8DC"/>
    <text x="44" y="252" class="muted" font-style="italic">… primary attributes continue (scrolls) …</text>

    <line x1="44" y1="268" x2="676" y2="268" stroke="#ECEFF1"/>

    <!-- ===== interpretation (comments, current form) ===== -->
    <text x="44" y="292" class="sect">INTERPRETATION</text>
    <rect x="44" y="300" width="632" height="82" rx="8" fill="#FFFFFF" stroke="#DADCE0"/>
    <text x="60" y="326" class="body">The haemoglobin is elevated. The MCV is marginally raised, consistent with</text>
    <text x="60" y="348" class="body">macrocytosis. Please correlate with clinical findings and consider repeat</text>
    <text x="60" y="370" class="body">testing.</text>

    <!-- ===== report (AI, markdown, collapsible) ===== -->
    <!-- collapsible header bar -->
    <rect x="44" y="398" width="632" height="30" rx="6" fill="#F1F3F4"/>
    <path d="M 62 409 l 6 6 l 6 -6" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round"/>
    <text x="86" y="418" class="rpth">Report</text>
    <rect x="612" y="404" width="52" height="18" rx="9" fill="#E8F0FE"/>
    <text x="638" y="417" class="tag" text-anchor="middle">Gemini</text>

    <!-- report body -->
    <rect x="44" y="432" width="632" height="238" rx="8" fill="#FBFBFC" stroke="#E3E5E8"/>

    <text x="60" y="458" class="rpth">Summary</text>
    <text x="60" y="480" class="body">The patient's haemoglobin is elevated at 194 g/L (reference 135–180 g/L), and
    </text>
    <text x="60" y="500" class="body">the mean corpuscular volume (MCV) is marginally raised at 100.2 fL (80–98 fL).
    </text>

    <text x="60" y="530" class="rpth">Interpretation</text>
    <text x="66" y="552" class="body">• Elevated haemoglobin may reflect haemoconcentration or a primary process.</text>
    <text x="66" y="572" class="body">• The marginal macrocytosis is a non-specific finding on its own.</text>

    <text x="60" y="602" class="body">Correlation with the clinical picture and repeat testing after an interval is
    </text>
    <text x="60" y="622" class="body">recommended before drawing firm conclusions.</text>

    <!-- report scrollbar hint -->
    <rect x="666" y="440" width="4" height="120" rx="2" fill="#CFD8DC"/>

    <!-- ===== explanatory notes ===== -->
    <text x="44" y="700" class="note">Interpretation = comments as they are today (concatenated). Future: an indexed,
        scrollable list of named/numbered
    </text>
    <text x="44" y="716" class="note">comments that behave like derived attributes.</text>
    <text x="44" y="734" class="note">Report = AI-generated, Markdown-formatted paragraphs. Collapse the header to hide
        it — hidden means it is not generated.
    </text>
</svg>
